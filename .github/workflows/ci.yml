name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Reused by publish.yml to run the tests before a release
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.2

      - name: Run ruff
        run: ruff check .

  tests:
    name: tests (Python ${{ matrix.python-version }}, torch ${{ matrix.torch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch: ["latest"]
        include:
          # Oldest supported torch (lower bound in pyproject.toml)
          - python-version: "3.10"
            torch: "2.1.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        # The CUDA wheels are several GB and are not needed to run the tests
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.torch }}" = "latest" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install package and test dependencies
        run: pip install ".[test]"

      - name: Run tests
        run: pytest
