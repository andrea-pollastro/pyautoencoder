name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: tests
    runs-on: ubuntu-latest
    # Restrict publishing to this environment: configure the same name in the
    # PyPI trusted publisher settings, and optionally add protection rules on GitHub.
    environment:
      name: pypi
      url: https://pypi.org/project/pyautoencoder/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs the tags to compute the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
